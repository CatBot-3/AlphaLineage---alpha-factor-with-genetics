[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alphalineage"
version = "0.1.0"
description = "Evolutionary (genetic-programming) alpha-factor mining platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "AlphaLineage" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "pyarrow>=14",
    "requests>=2.31",
    "yfinance>=0.2.40",
    "exchange-calendars>=4.11,<5",
    "python-dotenv>=0.21",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    # Phase 10 agent loop only. The non-agentic explanation path (Phase 9) deliberately stays on
    # plain `requests` — see docs/AGENT.md §7. Upper bounds are explicit because
    # LangChain's public API has broken across minor versions before.
    "langgraph>=1.0,<2",
    "langchain-core>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langchain-anthropic>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.6",
    "mypy>=1.10",
    "hypothesis>=6.100",
    "requests-mock>=1.12",
    "types-requests>=2.31",
    "httpx>=0.27",
]
# Optional: build the native evaluator accelerator (a platform C++ compiler is still required).
cpp = ["pybind11>=2.12", "cmake>=3.25", "ninja>=1.11"]

[tool.hatch.build]
# Release/Docker builds compile these into the package before hatch assembles the wheel. They are
# gitignored locally, so declare them as artifacts explicitly.
artifacts = ["src/alphalineage/_evaluator*.pyd", "src/alphalineage/_evaluator*.so"]

[tool.hatch.build.targets.wheel]
packages = ["src/alphalineage"]

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.cibuildwheel]
build = ["cp311-*", "cp312-*", "cp313-*"]
skip = ["*-win32", "*-manylinux_i686", "*-musllinux*"]
before-build = "pip install pybind11 cmake ninja && python scripts/build_cpp.py --skip-dependency-install"
test-command = "python -m alphalineage.smoke"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
mypy_path = "src"
ignore_missing_imports = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["alphalineage"]
branch = true
