# Dev GP search config (see scripts/run_gp.py).
universe: sp500-lite
as_of: "2026-06-01"      # point-in-time universe membership date
# Time-ordered split (fractions of dates). The TEST remainder is locked OOS (invariant 1).
train: 0.6
valid: 0.2
embargo: 5               # gap (trading days) between adjacent segments to prevent leakage

# Runtime-only compute policy. It changes speed/resource use, never the scientific search.
resources:
  profile: auto          # light=25%, auto=50%, maximum=100%, custom=cpu_budget_percent
  cpu_budget_percent: null

gp:
  population_size: 200
  generations: 25
  tournament_size: 3
  crossover_rate: 0.8
  subtree_mutation_rate: 0.1
  point_mutation_rate: 0.1
  max_depth: 6
  max_nodes: 40
  # Modern search scales complexity to a bounded maximum deduction at max_nodes.
  parsimony: 0.001
  complexity_penalty_mode: normalized_budget
  complexity_penalty_value: 0.005
  parameter_neighbor_fraction: 0.25
  validation_folds: 3
  exploration_profile: aggressive
  elitism: 1
  ic_method: spearman
  min_names: 5
  horizon: 1
  # When a signal is traded: close (same close that produced it; optimistic), next_open, or
  # next_close. Frozen per session.
  execution: next_open
  min_depth: 2
  seed: 0
  time_budget_s: null

# Backtest / portfolio (Phase 4). The verdict deflates on NET (after-cost) returns.
backtest:
  quantile: 0.2          # top/bottom fraction for the quantile long/short scheme
  commission_bps: 1.0
  slippage_bps: 5.0
